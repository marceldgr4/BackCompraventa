# ════════════════════════════════════════════════════════════════════════════
# CompraVenta — Docker Compose Integrado
# Backend API + Redis + PostgreSQL + pgAdmin Web + (opcional) Nginx
# ════════════════════════════════════════════════════════════════════════════
version: "3.9"

# ── Redes ─────────────────────────────────────────────────────────────────────
networks:
  compraventa-net:
    driver: bridge
    name: compraventa-net

# ── Volúmenes ─────────────────────────────────────────────────────────────────
volumes:
  redis-data:
    name: compraventa-redis-data
  app-logs:
    name: compraventa-logs
  postgres-data:
    name: compraventa-postgres-data

# ── Servicios ─────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL Server ───────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: compraventa-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      POSTGRES_DB: compraventa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - compraventa-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER} -d compraventa" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin Web Client (Para gestionar la BD desde el navegador) ──────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: compraventa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@compraventa.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "8081:80" # Acceso web en http://localhost:8081
    networks:
      - compraventa-net
    depends_on:
      - db

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: compraventa-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfilename redis-aof.aof
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - compraventa-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend Spring Boot ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: compraventa-backend:latest
    container_name: compraventa-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      # Conexión al Postgres de Docker (se usa el nombre del servicio 'db')
      LOCAL_DB_URL: jdbc:postgresql://db:5432/compraventa
      LOCAL_DB_USER: ${LOCAL_DB_USER:-usuario_admin}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-clave_secreta_db}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}

      # Supabase Sync
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SYNC_SIGNING_SECRET: ${SYNC_SIGNING_SECRET}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # JVM tuning
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "8080:8080"
    volumes:
      - app-logs:/app/logs
    networks:
      - compraventa-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Nginx Reverse Proxy (opcional, para producción) ──────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: compraventa-nginx
    restart: unless-stopped
    profiles:
      - production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - compraventa-net
