version: '3.9'

# ── CompraVenta — Stack completo local ─────────────────────────────────────
# Uso: docker-compose up -d
# Detener: docker-compose down
# Limpiar volúmenes: docker-compose down -v

services:

  # ── PostgreSQL Local ──────────────────────────────────────────────────────
  postgres-local:
    image: postgres:16-alpine
    container_name: compraventa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: compraventa
      POSTGRES_USER: ${DB_USER:-compraventa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-compraventa_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-compraventa} -d compraventa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: compraventa_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compraventa_api
    restart: unless-stopped
    depends_on:
      postgres-local:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      LOCAL_DB_URL: jdbc:postgresql://postgres-local:5432/compraventa
      LOCAL_DB_USER: ${DB_USER:-compraventa}
      LOCAL_DB_PASSWORD: ${DB_PASSWORD:-compraventa_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SYNC_SIGNING_SECRET: ${SYNC_SIGNING_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Next.js Web App ────────────────────────────────────────────────────────
  webapp:
    build:
      context: ../webapp
      dockerfile: Dockerfile
    container_name: compraventa_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "127.0.0.1:3000:3000"

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: compraventa_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - webapp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx

  # ── Backup automático diario ───────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: compraventa_backup
    restart: unless-stopped
    depends_on:
      - postgres-local
    environment:
      PGPASSWORD: ${DB_PASSWORD:-compraventa_dev}
    volumes:
      - ./backups:/backups
    command: >
      sh -c "while true; do
        pg_dump -h postgres-local -U ${DB_USER:-compraventa} compraventa
          | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
        find /backups -name '*.sql.gz' -mtime +30 -delete;
        echo 'Backup completado: '$$(date);
        sleep 86400;
      done"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local