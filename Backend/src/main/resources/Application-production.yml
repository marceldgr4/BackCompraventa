# ── Perfil: PRODUCTION ────────────────────────────────────────────────────
# Activo con: SPRING_PROFILES_ACTIVE=production
# Todas las variables sensibles DEBEN venir de variables de entorno.

spring:
  datasource:
    hikari:
      pool-name: ProdPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    out-of-order: false
    validate-on-migrate: true

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100

sync:
  enabled: true
  schedule:
    interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: WARN
    com.compraventa: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  file:
    name: /app/logs/compraventa-backend.log